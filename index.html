<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akj Library</title>
<style>
:root{
  --bg:#f7f5f0; --panel:#ffffff; --ink:#1f2320; --sub:#6b6f6a;
  --accent:#3f6b4e; --accent2:#c98a3a; --line:#e4e0d6; --hover:#f0ede4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171a17; --panel:#20241f; --ink:#eee; --sub:#9aa197;
    --accent:#7fbf94; --accent2:#e0a75e; --line:#333a32; --hover:#2a2f28;
  }
}
:root[data-theme="dark"]{
  --bg:#171a17; --panel:#20241f; --ink:#eee; --sub:#9aa197;
  --accent:#7fbf94; --accent2:#e0a75e; --line:#333a32; --hover:#2a2f28;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;
}
header{
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  border-bottom:1px solid var(--line);background:var(--panel);
  flex-shrink:0;
}
header h1{margin:0;font-size:17px;letter-spacing:.2px;}
header p{margin:2px 0 0;font-size:12px;color:var(--sub);}
.wrap{flex:1;display:flex;min-height:0;flex-direction:row;position:relative;}
@media (max-width:760px){ .wrap{flex-direction:column;} }
.viewer{
  flex:1 1 55%;min-width:0;display:flex;flex-direction:column;
  border-right:1px solid var(--line);background:var(--panel);
}
@media (max-width:760px){ .viewer{border-right:none;border-bottom:1px solid var(--line);min-height:45vh;} }
.filesPanel{
  flex:1 1 45%;display:flex;flex-direction:column;min-height:0;min-width:0;
  transition:flex-basis .15s, width .15s;
}
.filesPanel.collapsed{
  flex:0 0 0;width:0;min-width:0;overflow:hidden;border-left:0;
}
@media (max-width:760px){
  .filesPanel.collapsed{flex-basis:0;min-height:0;}
}
.minimizeBtn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:6px;padding:5px 9px;font-size:12.5px;cursor:pointer;
  display:flex;align-items:center;gap:4px;flex-shrink:0;
}
.minimizeBtn:active{background:var(--hover);}
.reopenBtn{
  display:none;
  position:absolute;top:8px;right:8px;z-index:5;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  align-items:center;gap:6px;
}
.reopenBtn.show{display:flex;}
.reopenBtn:active{background:var(--hover);}
.viewer .titlebar{padding:8px 12px;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pagebar{
  display:flex;align-items:center;gap:8px;padding:6px 12px;
  border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0;
}
.pagebar button{
  border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:6px;padding:5px 10px;font-size:12.5px;cursor:pointer;
  display:flex;align-items:center;gap:4px;
}
.pagebar button:active{background:var(--hover);}
.pagebar button:disabled{opacity:.4;cursor:default;}
.pagebar .pagelabel{font-size:12.5px;color:var(--sub);white-space:nowrap;}
.pagebar .pagelabel b{color:var(--ink);}
.pagebar input{
  width:48px;text-align:center;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);color:var(--ink);font-size:12.5px;padding:4px 2px;
}
.viewer iframe{flex:1;width:100%;border:0;background:#525659;}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;text-align:center;padding:20px;}
.search{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;}
.search input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;}
.tree{flex:1 1 45%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0;}
.folder>.flabel{
  display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;
  font-size:14px;font-weight:600;user-select:none;
}
.folder>.flabel:active,.folder>.flabel:hover{background:var(--hover);}
.folder .chev{transition:transform .15s;color:var(--accent);font-size:11px;width:10px;}
.folder.open>.flabel .chev{transform:rotate(90deg);}
.folder .count{margin-left:auto;font-size:11px;color:var(--sub);font-weight:400;}
.children{display:none;padding-left:20px;border-left:1px solid var(--line);margin-left:19px;}
.folder.open>.children{display:block;}
.file{
  display:flex;align-items:flex-start;gap:8px;padding:7px 14px 7px 4px;
  cursor:pointer;font-size:12.5px;line-height:1.35;color:var(--ink);border-radius:6px;margin:1px 6px;
}
.file:hover,.file:active{background:var(--hover);}
.file.active{background:var(--accent);color:#fff;}
.file .ic{flex-shrink:0;color:var(--accent2);}
.file.active .ic{color:#fff;}
.placeholder{padding:6px 14px 6px 4px;font-size:12px;color:var(--sub);font-style:italic;}
footer{padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--sub);border-top:1px solid var(--line);background:var(--panel);}
</style>
</head>

<header>
  <h1>📚 Akj Library</h1>

</header>

    <div class="titlebar" id="titlebar">No file selected</div>

      <button id="nextBtn">Next ▶</button>
      <button id="goBtn" style="margin-left:auto;">Go</button>
    </div>
    <div class="empty" id="emptyState">Select a PDF from the list to preview it here.</div>
    <iframe id="pdfFrame" style="display:none;" allow="autoplay"></iframe>
  </div>
  <div class="filesPanel" id="filesPanel">
    <div class="search">
      <button class="minimizeBtn" id="minimizeBtn" title="Hide file list">✕ Hide list</button>
      <input id="searchBox" placeholder="Search files & folders...">
    </div>
    <div class="tree" id="tree"></div>
  </div>
  <button class="reopenBtn" id="reopenBtn">☰ Files</button>
</div>
<footer>Akj folder · Drive</footer>

const tree = document.getElementById('tree');
const frame = document.getElementById('pdfFrame');
const emptyState = document.getElementById('emptyState');
const titlebar = document.getElementById('titlebar');
const searchBox = document.getElementById('searchBox');
const pagebar = document.getElementById('pagebar');
const filesPanel = document.getElementById('filesPanel');
const minimizeBtn = document.getElementById('minimizeBtn');
const reopenBtn = document.getElementById('reopenBtn');

minimizeBtn.onclick = ()=>{
  filesPanel.classList.add('collapsed');
  reopenBtn.classList.add('show');
};
reopenBtn.onclick = ()=>{
  filesPanel.classList.remove('collapsed');
  reopenBtn.classList.remove('show');
};
const pageInput = document.getElementById('pageInput');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const goBtn = document.getElementById('goBtn');

let currentId = null;
let currentPage = 1;

function frameSrcFor(id, page){
  return 'https://drive.google.com/file/d/' + id + '/preview#page=' + page;
}

function goToPage(page){
  if(!currentId) return;
  if(page < 1) page = 1;
  currentPage = page;
  pageInput.value = currentPage;
  frame.src = frameSrcFor(currentId, currentPage);
}

function openPdf(id, title, el){
  document.querySelectorAll('.file.active').forEach(f=>f.classList.remove('active'));
  if(el) el.classList.add('active');
  currentId = id;
  currentPage = 1;
  pageInput.value = 1;
  frame.src = frameSrcFor(id, currentPage);
  frame.style.display='block';
  emptyState.style.display='none';
  titlebar.textContent = title;
  pagebar.style.display='flex';
}

prevBtn.onclick = ()=> goToPage(currentPage - 1);
nextBtn.onclick = ()=> goToPage(currentPage + 1);
goBtn.onclick = ()=> goToPage(parseInt(pageInput.value,10) || 1);
pageInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter') goToPage(parseInt(pageInput.value,10) || 1);
});

function buildFile(name, id){
  const d = document.createElement('div');
  d.className='file';
  d.dataset.name = name.toLowerCase();
  d.innerHTML = '<span class="ic">📄</span><span>'+name+'</span>';
  d.onclick = ()=>openPdf(id, name, d);
  return d;
}

function buildFolder(node){
  const wrap = document.createElement('div');
  wrap.className='folder';
  wrap.dataset.name = node.name.toLowerCase();
  const total = (node.files ? node.files.length : 0) + (node.sub ? node.sub.reduce((a,s)=>a+(s.files?s.files.length:0),0) : 0);
  const label = document.createElement('div');
  label.className='flabel';
  label.innerHTML = '<span class="chev">▶</span><span>📁 '+node.name+'</span>'+(total?'<span class="count">'+total+'</span>':'');
  label.onclick = ()=>wrap.classList.toggle('open');
  const children = document.createElement('div');
  children.className='children';
  if(node.sub){
    node.sub.forEach(s=>children.appendChild(buildFolder(s)));
  }
  if(node.files){
    if(node.files.length===0){
      const p = document.createElement('div');
      p.className='placeholder';
      p.textContent = 'No files loaded yet';
      children.appendChild(p);
    } else {
      node.files.forEach(([name,id])=>children.appendChild(buildFile(name,id)));
    }
  }
  wrap.appendChild(label);
  wrap.appendChild(children);
  return wrap;
}

data.forEach(n=>tree.appendChild(buildFolder(n)));

searchBox.addEventListener('input', ()=>{
  const q = searchBox.value.trim().toLowerCase();
  const allFolders = tree.querySelectorAll('.folder');
  if(!q){
    allFolders.forEach(f=>{f.style.display='';f.classList.remove('open');});
    tree.querySelectorAll('.file').forEach(f=>f.style.display='');
    return;
  }
  allFolders.forEach(f=>f.style.display='none');
  tree.querySelectorAll('.file').forEach(fileEl=>{
    const match = fileEl.dataset.name.includes(q);
    fileEl.style.display = match ? '' : 'none';
    if(match){
      let p = fileEl.parentElement;
      while(p && p.classList && p.classList.contains('children')){
        const folder = p.parentElement;
        folder.style.display='';
        folder.classList.add('open');
        p = folder.parentElement;
      }
    }
  });
});
</script>
